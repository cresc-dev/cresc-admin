name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # bun 1.3.14 (current stable) deterministically fails to load antd's
          # CJS entry in tests here (Export named 'Alert' not found in
          # antd/lib/index.js) while 1.4.0 canary is verified green; the same
          # canary channel is already used for cresc-server builds.
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
