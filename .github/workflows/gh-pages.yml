name: github pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # bun 1.3.14 (current stable) deterministically fails to load antd's
          # CJS entry in tests here (Export named 'Alert' not found in
          # antd/lib/index.js) while 1.4.0 canary is verified green; the same
          # canary channel is already used for cresc-server builds.
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check (typecheck, lint, test)
        run: bun run ci

      - name: Build
        run: |
          bun run build
          cp CNAME dist/
          cp .nojekyll dist/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
