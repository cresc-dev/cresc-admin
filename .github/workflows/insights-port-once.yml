name: Cresc insights port preparation
on:
  push:
    branches: [fix/insights-metric-contract-20260927]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'cresc-dev/cresc-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked Cresc dependencies
        run: bun install --frozen-lockfile
      - name: Apply the audited insights-only changes
        run: python3 scripts/port-insights-apply.py
      - name: Format only changed sources and regression tests
        run: |
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          paths.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          paths.add('src/pages/app-insights/cresc-timezone.test.tsx')
          selected = sorted(p for p in paths if p.startswith('src/') and p.endswith(('.ts','.tsx','.json')))
          subprocess.run(['bun','x','--no-install','biome','check','--write',*selected],check=True)
          PY
      - name: Typecheck, lint and all tests
        run: |
          bun run typecheck
          bun run lint
          bun run test
      - name: Production build and bundle-size gates
        run: bun run build:check
        env:
          CI: 'true'
      - name: Verify product boundaries and commit only scoped source edits
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json bun.lock rsbuild.config.ts .github/workflows/ci.yml src/services src/utils/timezone.ts src/pages/realtime-metrics.tsx src/pages/realtime-metrics-geo.tsx src/pages/app-insights/release-insights-panel.tsx src/pages/app-insights/release-insights-types.ts
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          permitted = {
            'src/constants/i18n-keys.ts', 'src/constants/metric-thresholds.ts',
            'src/i18n/canonical-resources.test.ts', 'src/i18n/index.ts', 'src/i18n/locales.test.ts',
            'src/i18n/locales/en.json', 'src/i18n/locales/zh-CN.json', 'src/i18n/resources.ts',
            'src/pages/admin-service-status/version-health-overview-panel.tsx',
          }
          names = set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          names.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          names.add('src/pages/app-insights/cresc-timezone.test.tsx')
          for name in names:
            assert name in permitted or (name.startswith('src/pages/app-insights/') and name.endswith(('.ts','.tsx'))), name
          subprocess.run(['git','add','--',*sorted(names)],check=True)
          PY
          branch=fix/insights-metric-contract-20260927
          actual="$(git ls-remote origin refs/heads/$branch | cut -f1)"
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git commit -m 'fix(insights): port corrected metrics with Cresc timezone and product compatibility'
          git push origin HEAD:refs/heads/$branch
